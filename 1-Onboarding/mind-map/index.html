<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1-Onboarding assignments map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm study tool for HYF students and coaches; every node is a door to GitHub.
   IDEA: a weather-chart style map of the module: one field, branches by week.
   PICTURE: the mind map itself, full width, filling the first screen.
   COLOUR and TYPE: navy ground, yellow weeks, blue repositories, teal files, red root; Red Hat Display + Text.
   LAYOUT: slim header with legend and controls, then the scrollable map; tooltip card on hover. */
:root{color-scheme:dark;--bg:#0b1433;--ink:#e9edfb;--mute:#9aa6cf;--line:#3a4a86;--card:#14214f;--card2:#1b2a62;--yellow:#f7e463;--blue:#3b4fd8;--teal:#4fc1c6;--red:#e8452c}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Red Hat Text",system-ui,sans-serif;overflow-x:clip}
header{padding:20px max(4vw,16px) 12px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between;border-bottom:1px solid #1d2b63}
h1{font:800 clamp(24px,3.4vw,38px)/1.05 "Red Hat Display",sans-serif;margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--mute);font-size:15px;max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:min(240px,70vw);min-height:44px}
.tools button{font:600 14px "Red Hat Text",sans-serif;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:0 14px;min-height:44px;cursor:pointer}
.tools button:hover{border-color:var(--teal)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
#wrap{overflow:auto;height:calc(100vh - 150px);min-height:420px;position:relative;cursor:grab}
#wrap.drag{cursor:grabbing}
#stage{position:relative;transform-origin:0 0}
#links{position:absolute;inset:0;overflow:visible;pointer-events:none}
#links path{fill:none;stroke:var(--line);stroke-width:1.6}
.node{position:absolute;display:flex;align-items:center;gap:6px;border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.3;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid #2a3a78;transition:border-color .15s,transform .15s}
.node:hover,.node:focus-visible{border-color:var(--teal);transform:translateY(-1px)}
.node .lbl{flex:1}
.node.root{background:var(--red);border-color:var(--red);color:#fff;font:800 20px/1.1 "Red Hat Display",sans-serif;padding:14px 16px;border-radius:999px;justify-content:center}
.node.week{background:var(--yellow);border-color:var(--yellow);color:#14193a;font:800 18px "Red Hat Display",sans-serif}
.node.file{background:transparent;border:2px solid var(--teal);color:var(--teal);font-weight:600}
.node.repo{background:var(--blue);border-color:var(--blue);color:#fff;border-radius:999px;font-weight:600;padding-inline:14px}
.node.hit{box-shadow:0 0 0 3px var(--yellow)}
.node.dim{opacity:.35}
.tog{flex:none;width:22px;height:22px;border-radius:50%;border:0;display:grid;place-items:center;font:700 14px/1 "Red Hat Text",sans-serif;background:rgba(0,0,0,.25);color:inherit;cursor:pointer;padding:0}
.tog::before{content:"";position:absolute;inset:-11px;}
#tip{position:fixed;z-index:9;max-width:340px;background:#f4f6ff;color:#121a3d;border-radius:14px;padding:12px 14px 12px;box-shadow:0 12px 32px rgba(0,0,0,.45);font-size:14px;line-height:1.45;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font:700 15px/1.25 "Red Hat Display",sans-serif;margin:2px 0 6px}
#tip small{display:block;text-transform:none;color:#4a5584;font-weight:600;font-size:12px}
#tip code{display:block;margin-top:8px;font-size:12px;color:#3b4fd8;overflow-wrap:anywhere}
.note{padding:10px max(4vw,16px);color:var(--mute);font-size:13px}
@media(max-width:600px){#wrap{height:70vh}header{align-items:start}}
@media(prefers-reduced-motion:reduce){.node,#tip{transition:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>1-Onboarding: every assignment</h1>
    <p>Hover a node for a summary; click it to open the exact section, issue or repository on GitHub.</p>
    <div class="legend">
      <span><i style="background:var(--yellow)"></i>Week</span>
      <span><i style="border:2px solid var(--teal)"></i>Curriculum file</span>
      <span><i style="background:var(--blue);border-radius:99px"></i>Repository</span>
      <span><i style="background:var(--card);border:1px solid #2a3a78"></i>Assignment</span>
    </div>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search assignments" aria-label="Search assignments">
    <button id="exp" type="button">Expand all</button>
    <button id="col" type="button">Weeks only</button>
    <button id="zo" type="button" aria-label="Zoom out">−</button>
    <button id="zi" type="button" aria-label="Zoom in">+</button>
  </div>
</header>
<div id="wrap"><div id="stage"><svg id="links"></svg></div></div>
<div id="tip" role="tooltip"></div>
<p class="note">Source: HackYourFutureBelgium/Intro-to-Programming (1-Onboarding) and the repositories it links to, read on 24 Nov 2026.</p>
<script>
{
const TREE = {"t": "1-Onboarding", "k": "root", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/tree/main/1-Onboarding", "s": "Onboarding module of HYF Belgium's Intro to Programming: 3 weeks of prep, class lesson plans and coursework.", "c": [{"t": "Week 1", "k": "week", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/tree/main/1-Onboarding/Week%201", "s": "Week 1: VSCode and Git basics, Slack, the Coursework Planner, reading GitHub, and a first pull request.", "c": [{"t": "Preparation", "k": "file", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%201/preparation.md", "s": "Self-study before class: install the tools, then learn commits, forks, clones and branches step by step.", "c": [{"t": "Install VSCode", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%201/preparation.md#1-install-vscode", "s": "Download and install VS Code, the editor used throughout the course, and watch a short tour of its interface.", "c": []}, {"t": "Check Git", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%201/preparation.md#2-check-git", "s": "Run git --version in a terminal to confirm Git is installed; if not, follow the setup guide or ask on Slack.", "c": []}, {"t": "Create a work folder (HYF)", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%201/preparation.md#3-create-a-work-folder-hyf", "s": "Using only the terminal (pwd, ls, mkdir, cd), create an HYF folder in your home directory to hold all course work.", "c": []}, {"t": "CodeYourFuture/education-blog", "k": "repo", "u": "https://github.com/CodeYourFuture/education-blog", "s": "Demo blog repository used to practise reading files, commits and history on GitHub.", "c": [{"t": "Version History", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Pro o-to-Programming/blob/main/1-Onboarding/Week%202/preparation.md#2-how-to-structure-a-web-form", "s": "Read MDN's 'How to structure a web form' (required); optionally test yourself with the forms and buttons exercises.", "c": []}, {"t": "CSS layout", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%202/preparation.md#3-css-layout", "s": "Work through MDN's CSS layout path: floats, positioning, Flexbox, Grid, responsive design, media queries; optional layout challenge.", "c": []}]}, {"t": "Lesson plan", "k": "file", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%202/lesson-plan.md", "s": "Class day: working with others, Git commit/push practice in pairs, live code review, and a feedback-form challenge.", "c": [{"t": "Group discussion: Working with others", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%202/lesson-plan.md#topic-1--group-discussion-working-with-others", "s": "Discuss three scenarios (group work, watching someone solve Codewars, copy-pasting ChatGPT answers): what's good, what's not, and why.", "c": []}, {"t": "Consolidating Git", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%202/lesson-plan.md#topic-2--consolidating-git", "s": "Pair work to save, stage, commit and push changes, and explain what pushing means.", "c": [{"t": "HackYourFutureBelgium/demo-repo", "k": "repo", "u": "https://github.com/HackYourFutureBelgium/demo-repo", "s": "Demo repository used to answer questions about commits, authors and history.", "c": [{"t": "A. Exploring GitHub repositories", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%202/lesson-plan.md#a-exploring-github-repositories", "s": "In pairs, answer questions about demo-repo's history: number of commits, authors, changes and the first commit's hash.", "c": []}]}, {"t": "CodeYourFuture/cyf-demo-repo", "k": "repo", "u": "https://github.com/CodeYourFuture/cyf-demo-repo", "s": "Repository you fork and clone to practise branching, committing and pushing.", "c": [{"t": "B. Creating a fork, cloning a repository and creating a branch", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%202/lesson-plan.md#b-creating-a-fork-cloning-a-repository-and-creating-a-branch", "s": "Fork cyf-demo-repo, explain fork vs clone, clone it, open it in VS Code and create a week-2-workshop branch.", "c": []}, {"t": "C. Committing and pushing", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%202/lesson-plan.md#c-committing-and-pushing", "s": "Edit file.txt, view changes in Source Control, stage, commit on week-2-workshop, push it to your fork, then discuss the Git questions.", "c": []}]}]}, {"t": "Mentored code review", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%202/lesson-plan.md#topic-3--mentored-code-review", "s": "A coach reviews pull requests live, thinking out loud, while learners ask what a reviewer looks for.", "c": []}, {"t": "Structuring a feedback form", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%202/lesson-plan.md#topic-4--structuring-a-feedback-form", "s": "Pair or group work: fork the challenge, follow its README, commit clearly, open a PR and ask a colleague to review it.", "c": [{"t": "Challenge-Feedback-form", "k": "repo", "u": "https://github.com/HackYourFutureBelgium/Challenge-Feedback-form", "s": "Feedback form for a fictional hotel to mark up with form controls and structure (based on MDN's forms challenge).", "c": [{"t": "Implementing form controls", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Challenge-Feedback-form/blob/main/README.md#implementing-form-controls", "s": "Turn the text lines into radio buttons, checkboxes, drop-downs, a textarea, text inputs and a submit button, with labels and legends.", "c": []}, {"t": "Structuring the form", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Challenge-Feedback-form/blob/main/README.md#structuring-the-form", "s": "Wrap it in a form element, wrap sections (class form-section), add separator elements and a line break.", "c": []}, {"t": "Additional HTML features", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Challenge-Feedback-form/blob/main/README.md#additional-html-features", "s": "Mark up the headings and opening paragraph, add placeholder links and a decorative image with empty alt text (stretch: do it with CSS).", "c": []}]}]}]}, {"t": "Coursework", "k": "file", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%202/coursework.md", "s": "Points to the Module-Onboarding repo, whose issues are the week's coursework.", "c": [{"t": "Module-Onboarding (Week 2 issues)", "k": "repo", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues?q=is%3Aissue%20label%3A%22Week%202%22", "s": "The Week 2 coursework issues of the Module-Onboarding repo.", "c": [{"t": "04 - Do the prep", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/5", "s": "Work through the Week 2 preparation first: it teaches the concepts the coursework practises.", "c": []}, {"t": "05 - Form Controls", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/6", "s": "Build a t-shirt order form (name, email, 3 colours, 6 sizes; all required, validated), test it with Devtools, and submit as a PR.", "c": []}, {"t": "06 - Get Code Review and Iterate", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/7", "s": "Add 'Needs Review' to your Form Controls PR and keep improving it after each review until it's marked Complete.", "c": []}, {"t": "07 - Evaluate and interpret data with different spreadsheet functions, filters, and charts using Google Sheets.", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/8", "s": "Complete Google Workspace Sheets part 2 (functions, filters, charts) with its video and starter project; share your public sheet.", "c": []}, {"t": "08 - Developing a growth mindset", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/9", "s": "Watch Carol Dweck's TED talk and a neuroplasticity video, then write a reflection on growth mindset (share on Slack).", "c": []}]}]}]}, {"t": "Week 3", "k": "week", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/tree/main/1-Onboarding/Week%203", "s": "Week 3: accessibility testing, interview introductions, Devtools, SQL in Google Sheets and the terminal.", "c": [{"t": "Preparation", "k": "file", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/preparation.md", "s": "Self-study: accessibility testing tools and preparing your interview introduction.", "c": [{"t": "Record a goose sighting", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/preparation.md#1-record-a-goose-sighting", "s": "Study WAVE, Lighthouse and Devtools, then spend ~20 minutes finding accessibility issues in the fictional 'Record a goose sighting' site.", "c": []}, {"t": "Interview Introductions", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/preparation.md#2-interview-introductions", "s": "Learn to answer 'Tell me about yourself' in 1-2 minutes with the Present-Past-Future model, and start drafting your own.", "c": []}]}, {"t": "Lesson plan", "k": "file", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/lesson-plan.md", "s": "Class day: interview intros, a Devtools workshop, an SQL team quiz and terminal practice.", "c": [{"t": "Interview Introductions", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/lesson-plan.md#topic-1--interview-introductions", "s": "Tailor an introduction to a job's requirements, see what makes one engaging, and deliver it out loud.", "c": [{"t": "Introduce Jane (Group work)", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/lesson-plan.md#introduce-jane-group-work", "s": "Write a 1-2 minute intro for fictional Jane applying to Software for Lawyers Ltd, read it to your group, give feedback and pick the best.", "c": []}]}, {"t": "Developer Tools", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/lesson-plan.md#topic-2--developer-tools", "s": "Timed group challenges with Chrome Devtools on the CYF workshop page: DOM, CSS variables, Grid, Lighthouse.", "c": [{"t": "2.1 Inspect the DOM", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/lesson-plan.md#21-inspect-the-dom", "s": "Find the font, brand colour and CSS variables of the workshop page, then change the variables and predict what happens.", "c": []}, {"t": "2.2 Grid Inspector", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/lesson-plan.md#22-grid-inspector", "s": "Find a grid element, switch on the Grid Badge and use the Grid Editor to change the layout.", "c": []}, {"t": "2.3 Lighthouse", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/lesson-plan.md#23-lighthouse", "s": "Run a Lighthouse audit, identify and fix the issue, use Devtools hover explanations and ask ChatGPT to explain them.", "c": []}, {"t": "2.4 More (free study time)", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/lesson-plan.md#24-more-for-the-free-study-time", "s": "Keep inspecting websites as you browse, change their styles, and share a useful Devtools tip in your class channel.", "c": []}]}, {"t": "Google Sheets SQL Showdown: Team Quiz", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/lesson-plan.md#google-sheets-sql-showdown-team-quiz", "s": "Teams of 3-4 write Google Sheets SQL queries on paper over timed rounds: SELECT, WHERE, then advanced filters.", "c": []}, {"t": "Know Your Computer", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/lesson-plan.md#know-your-computer", "s": "Terminal only, no mouse: create folders and a shopping-list file, move, copy, append and display it with Linux commands.", "c": []}, {"t": "Wrap up", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/lesson-plan.md#wrap-up-last-20-min", "s": "Last 20 minutes in a circle: share your name, one achievement, your next task and one thing you need help with.", "c": []}]}, {"t": "Coursework", "k": "file", "u": "https://github.com/HackYourFutureBelgium/Intro-to-Programming/blob/main/1-Onboarding/Week%203/coursework.md", "s": "Points to the Module-Onboarding repo, whose issues are the week's coursework.", "c": [{"t": "Module-Onboarding (Week 3 issues)", "k": "repo", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues?q=is%3Aissue%20label%3A%22Week%203%22", "s": "The Week 3 coursework issues of the Module-Onboarding repo.", "c": [{"t": "09 - Prepare for the Devtools exercise on Sunday", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/10", "s": "Before class: install Chrome, create a ChatGPT account, and study the Devtools workshop page and prep.", "c": []}, {"t": "10 - Query Data in Google Sheets with SQL", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/11", "s": "Code along with the 'SQL in Google Sheets' video using the provided dataset, up to the GROUP BY step.", "c": []}, {"t": "11 - SQL Problems using Google Sheets", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/13", "s": "Write SQL queries on the same dataset to answer business questions (e.g. Emily Smith's deals by value and close date).", "c": []}, {"t": "12 - Evaluate, and interpret data with Google Sheets", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/12", "s": "Complete Google Workspace Sheets part 3 (advanced functions, conditional formatting); share your public sheet.", "c": []}, {"t": "13 - Sign up for Code in Place", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/14", "s": "Sign up for Stanford's free Python course Code in Place, or work through its materials if no cohort is open.", "c": []}, {"t": "14 - Join Codewars", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/16", "s": "Sign up to Codewars, link GitHub, join the HackYourFuture-Belgium clan; from now on do 3 kata a week.", "c": []}, {"t": "15 - Stretch: Collect your self study courses", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/15", "s": "Optional: research free self-study resources (MDN curriculum, Khan Academy, Scrimba, The Odin Project...) and judge their quality.", "c": []}]}]}]}, {"t": "Module-Onboarding (no week label)", "k": "repo", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding", "s": "Module-Onboarding issues that have no week label.", "c": [{"t": "16 - SUCCESS: How do we know if you have completed Onboarding?", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/51", "s": "Module success criteria: meet the learning objectives, finish all mandatory issues, attend class, and open a completion issue on your planner.", "c": []}, {"t": "01 - Check your setup", "k": "task", "u": "https://github.com/HackYourFutureBelgium/Module-Onboarding/issues/94", "s": "Newer open issue; it only links to 'Check your setup' in the next module (Module-Structuring-and-Testing-Data, issue 1).", "c": []}]}]};
const KIND = {root:"Module", week:"Week", file:"Curriculum file", repo:"Repository", task:"Assignment"};
const W = {root:190, week:150, file:170, repo:240, task:270};
const COL = 320, GAP = 12, PAD = 24;
const stage = document.getElementById('stage'), svg = document.getElementById('links');
const wrap = document.getElementById('wrap'), tip = document.getElementById('tip');
let id = 0, scale = 1;
const all = [];
function prep(n, d, parent){ n.id = id++; n.d = d; n.p = parent; n.open = true; all.push(n); n.c.forEach(k => prep(k, d + 1, n)); }
prep(TREE, 0, null);

function el(n){
  const a = document.createElement('a');
  a.className = 'node ' + n.k; a.href = n.u; a.target = '_blank'; a.rel = 'noopener';
  a.style.width = W[n.k] + 'px';
  const l = document.createElement('span'); l.className = 'lbl'; l.textContent = n.t; a.append(l);
  if (n.c.length && n.k !== 'root'){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tog';
    b.setAttribute('aria-label', 'Show or hide ' + n.t);
    b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); n.open = !n.open; layout(); });
    a.append(b); n.btn = b;
  }
  a.addEventListener('mouseenter', e => show(n, a));
  a.addEventListener('focus', e => show(n, a));
  a.addEventListener('mouseleave', hide); a.addEventListener('blur', hide);
  stage.append(a); n.el = a;
}
all.forEach(el);

function show(n, a){
  tip.innerHTML = '';
  const s = document.createElement('small'); s.textContent = KIND[n.k];
  const b = document.createElement('b'); b.textContent = n.t;
  const p = document.createElement('div'); p.textContent = n.s;
  const c = document.createElement('code'); c.textContent = n.u.replace('https://github.com/', 'github.com/');
  tip.append(s, b, p, c);
  const r = a.getBoundingClientRect(), tw = Math.min(340, innerWidth - 24);
  let x = r.right + 12; if (x + tw > innerWidth - 8) x = Math.max(8, r.left - tw - 12);
  if (x < 8 || r.width > innerWidth - tw - 40) x = Math.max(8, Math.min(r.left, innerWidth - tw - 8));
  tip.style.left = x + 'px'; tip.style.top = '0px'; tip.classList.add('on');
  const th = tip.offsetHeight; let y = r.top + r.height / 2 - th / 2;
  if (x >= r.left && x < r.right) y = r.bottom + 8;
  tip.style.top = Math.max(8, Math.min(y, innerHeight - th - 8)) + 'px';
}
function hide(){ tip.classList.remove('on'); }

function visible(n){ for (let p = n.p; p; p = p.p) if (!p.open) return false; return true; }
function layout(){
  all.forEach(n => { n.vis = visible(n); n.el.style.display = n.vis ? '' : 'none'; if (n.btn) n.btn.textContent = n.open ? '−' : '+'; });
  all.forEach(n => { if (n.vis) n.h = n.el.offsetHeight; });
  let y = PAD;
  (function place(n){
    const kids = n.open ? n.c : [];
    if (!kids.length){ n.cy = y + n.h / 2; y += n.h + GAP; }
    else {
      kids.forEach(place);
      n.cy = (kids[0].cy + kids[kids.length - 1].cy) / 2;
      if (n.cy + n.h / 2 + GAP > y) y = n.cy + n.h / 2 + GAP;
      if (n.k === 'week' || n.k === 'root') y += 18;
    }
  })(TREE);
  let maxX = 0;
  all.forEach(n => { if (!n.vis) return;
    n.x = PAD + n.d * COL; n.top = n.cy - n.h / 2;
    n.el.style.left = n.x + 'px'; n.el.style.top = n.top + 'px';
    maxX = Math.max(maxX, n.x + W[n.k]); });
  const H = y + PAD, Wd = maxX + PAD;
  stage.style.width = Wd + 'px'; stage.style.height = H + 'px';
  svg.setAttribute('width', Wd); svg.setAttribute('height', H);
  let d = '';
  all.forEach(n => { if (!n.vis || !n.open) return;
    const x1 = n.x + W[n.k], y1 = n.cy;
    n.c.forEach(k => { const x2 = k.x, y2 = k.cy, m = (x1 + x2) / 2;
      d += `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2} `; }); });
  svg.innerHTML = `<path d="${d}"/>`;
  applyScale();
}
function applyScale(){
  stage.style.transform = `scale(${scale})`;
  const w = parseFloat(stage.style.width), h = parseFloat(stage.style.height);
  wrap.firstElementChild.style.marginRight = (w * scale - w) + 'px';
  wrap.firstElementChild.style.marginBottom = (h * scale - h) + 'px';
}
document.getElementById('zi').onclick = () => { scale = Math.min(1.4, +(scale + .1).toFixed(2)); applyScale(); };
document.getElementById('zo').onclick = () => { scale = Math.max(.4, +(scale - .1).toFixed(2)); applyScale(); };
document.getElementById('exp').onclick = () => { all.forEach(n => n.open = true); layout(); };
document.getElementById('col').onclick = () => { all.forEach(n => n.open = n.k === 'root'); layout(); };

const q = document.getElementById('q');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  all.forEach(n => n.el.classList.remove('hit', 'dim'));
  if (!s){ layout(); return; }
  const hits = all.filter(n => (n.t + ' ' + n.s).toLowerCase().includes(s));
  all.forEach(n => n.el.classList.add('dim'));
  hits.forEach(n => { n.el.classList.remove('dim'); n.el.classList.add('hit'); for (let p = n.p; p; p = p.p){ p.open = true; p.el.classList.remove('dim'); } });
  layout();
  if (hits[0]) hits[0].el.scrollIntoView({block:'center', inline:'center', behavior:'smooth'});
});

// drag to pan
let drag = null;
wrap.addEventListener('pointerdown', e => { if (e.target.closest('.node') || e.pointerType !== 'mouse') return; drag = {x:e.clientX, y:e.clientY, l:wrap.scrollLeft, t:wrap.scrollTop}; wrap.classList.add('drag'); });
addEventListener('pointermove', e => { if (!drag) return; wrap.scrollLeft = drag.l - (e.clientX - drag.x); wrap.scrollTop = drag.t - (e.clientY - drag.y); });
addEventListener('pointerup', () => { drag = null; wrap.classList.remove('drag'); });
wrap.addEventListener('scroll', hide);

if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
layout();
}
</script>
